query GetWalletOverview @auth(level: USER) {
  user(key: { uid_expr: "auth.uid" }) {
    uid
    username
    email
    virtualBalance
    portfolio: portfolio_on_user {
      id
      holdings: holdings_on_portfolio(orderBy: [{ symbol: ASC }], limit: 200) {
        symbol
        quantity
        averagePurchasePrice
      }
    }
  }
}

query GetTransactionHistory($limit: Int = 20) @auth(level: USER) {
  transactions(
    where: { userUid: { eq_expr: "auth.uid" } }
    orderBy: [{ timestamp: DESC }]
    limit: $limit
  ) {
    id
    symbol
    type
    quantity
    priceAtExecution
    timestamp
  }
}
