type User @table(key: "uid") {
  uid: String! @default(expr: "auth.uid")
  username: String!
  email: String! @unique
  virtualBalance: Float!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Portfolio @table {
  user: User! @unique
}

type Holding @table(key: ["portfolio", "symbol"]) {
  portfolio: Portfolio!
  symbol: String!
  quantity: Float!
  averagePurchasePrice: Float!
}

type Transaction @table {
  user: User!
  symbol: String!
  type: String!
  quantity: Float!
  priceAtExecution: Float!
  timestamp: Timestamp!
}

type MarketCache @table {
  symbol: String!
  currentPrice: Float!
  lastUpdated: Timestamp!
  changePercentage: Float
}
